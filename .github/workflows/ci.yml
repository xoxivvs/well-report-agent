name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Линт (ruff)
        run: ruff check src tools tests scripts app.py

      - name: Тесты (pytest)
        run: pytest tests/ -v
